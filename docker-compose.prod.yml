services:
  web:
    image: djoufson/dotnet-africa-website:latest
    container_name: dotnet-africa-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
